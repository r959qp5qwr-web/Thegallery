module:
  id: ux-design-assurance
  version: 1.1.0

product:
  id: thegallery
  name: The Gallery
  target_platforms:
    - mobile web (primary; opened from a WhatsApp link in a phone browser)
    - tablet web
    - desktop web

foundations:
  ux: ux/UX_FOUNDATION.md
  interface: ux/INTERFACE_FOUNDATION.md

interface_reference_set:
  path: ux/reference/interface/INTERFACE_REFERENCE_SET.md
  status: DRAFT_AWAITING_GOVERNOR_ACCEPTANCE
  surfaces: [R-1, R-2, R-3]
  inheritance_demonstrations: [I-1, I-2, I-3, I-4, I-5, I-6]

active_journey: J-001

# Critical journeys (Playbook §5A classification by consequence). Statuses are the module's
# legal statuses; a status changes only with the evidence the gate names.
# INTERFACE_DESIGNING here means: UX section frozen at UX_READY, interface section complete,
# INTERFACE_READY withheld until the governor accepts the reference set (G-IF1).
journeys:
  - id: J-001
    name: Visitor encounters a work and reaches the maker
    criticality: CRITICAL
    reason: delivers core value; crosses roles; ends at the trust-bearing direct-contact handoff
    status: INTERFACE_DESIGNING
    contract: ux/journeys/J-001-visitor-encounter-to-contact.md
    wireframes: [ux/wireframes/J-001-flow.png]
    interface_references: [ux/reference/interface/renders/R-1-entrance.png, ux/reference/interface/renders/R-2-work-detail.png, ux/reference/interface/renders/R-2b-handoff-sheet.png, ux/reference/interface/renders/I-1-maker-gallery.png]
    last_verified_build: ""
    verification_report: ""
    deferred_reason: ""
    reopen_condition: ""
    superseded_by: ""
  - id: J-002
    name: Maker enters by email, creates a gallery and publishes a first work
    criticality: CRITICAL
    reason: sign-in and admission door; creates a consequential public commitment; privacy of the account email
    status: INTERFACE_DESIGNING
    contract: ux/journeys/J-002-maker-door-and-first-publish.md
    wireframes: [ux/wireframes/J-002-flow.png]
    interface_references: [ux/reference/interface/renders/R-3-studio-add-work.png, ux/reference/interface/renders/I-4-maker-door.png, ux/reference/interface/renders/I-5-states.png]
    last_verified_build: ""
    verification_report: ""
    deferred_reason: ""
    reopen_condition: ""
    superseded_by: ""
  - id: J-003
    name: Maker changes work status and every public surface follows
    criticality: CRITICAL
    reason: high-frequency routine act; truthfulness promise P-11 depends on it
    status: UX_READY
    contract: ux/journeys/J-003-status-change-propagates.md
    wireframes: [ux/wireframes/J-003-flow.png]
    interface_references: []
    last_verified_build: ""
    verification_report: ""
    deferred_reason: ""
    reopen_condition: ""
    superseded_by: ""
  - id: J-004
    name: Operator resolves a report, suspends and reinstates a maker
    criticality: CRITICAL
    reason: operator journey holding up user-facing promises P-14; irreversible-feeling sanction with a release path
    status: INTERFACE_DESIGNING
    contract: ux/journeys/J-004-operator-report-to-reinstatement.md
    wireframes: [ux/wireframes/J-004-flow.png]
    interface_references: [ux/reference/interface/renders/I-6-operator-report.png]
    last_verified_build: ""
    verification_report: ""
    deferred_reason: ""
    reopen_condition: ""
    superseded_by: ""
  - id: J-005
    name: Maker recovers access, signs out and closes the account
    criticality: CRITICAL
    reason: recovery and closure door (Playbook §6 foundation journeys); consequence of closure on public work
    status: IDENTIFIED
    contract: ""
    wireframes: []
    interface_references: []
    last_verified_build: ""
    verification_report: ""
    deferred_reason: "Designed in Stage 2 alongside the door it belongs to; identified now so it cannot be forgotten"
    reopen_condition: ""
    superseded_by: ""
  - id: J-006
    name: Visitor discovers, saves and shares by material, search and workshops
    criticality: CRITICAL
    reason: high-frequency discovery; share links travel through WhatsApp and must return to the exact object
    status: IDENTIFIED
    contract: ""
    wireframes: []
    interface_references: []
    last_verified_build: ""
    verification_report: ""
    deferred_reason: "Stage 3 journey; entrance and discovery surfaces are established at Stage 1 through J-001's inheritance demonstrations"
    reopen_condition: ""
    superseded_by: ""

legal_statuses:
  - IDENTIFIED
  - UX_DESIGNING
  - UX_READY
  - INTERFACE_DESIGNING
  - INTERFACE_READY
  - IMPLEMENTING
  - VERIFY_REQUIRED
  - VERIFYING
  - VERIFIED
  - DEFECT
  - UNKNOWN
  - DEFERRED
  - SUPERSEDED
