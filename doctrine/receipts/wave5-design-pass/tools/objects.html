<script type="module">
import * as THREE from "three";

// Synthetic studio photographs of invented objects. No real work, no real maker.
function noiseCanvas(w, h, base, spots, seed = 1, streak = 0) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (const [col, n, size, alpha] of spots) {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) {
      g.globalAlpha = alpha * r();
      const x = r() * w, y = r() * h, rr = size * (0.3 + r());
      g.beginPath(); g.ellipse(x, y, rr * (streak ? 0.35 : 1), rr * (streak ? 2.6 : 1), 0, 0, 7); g.fill();

  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function lathe(profile, mat) {
  const pts = profile.map(([x, y]) => new THREE.Vector2(x, y));
  const geo = new THREE.LatheGeometry(pts, 160);
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true; return m;
}
function smooth(points, n = 80) {
  const curve = new THREE.SplineCurve(points.map(([x, y]) => new THREE.Vector2(x, y)));
  return curve.getPoints(n).map((p) => [Math.max(0.001, p.x), p.y]);
}

const scenes = {
  vessel: { w: 1200, h: 1500, bg: "#d9cbb6", build() {
    const tex = noiseCanvas(1024, 1024, "#8a6a4e", [["#c9b79a", 900, 14, .35], ["#4e3a2a", 500, 10, .5], ["#d8cdb8", 260, 28, .25]], 7, 1);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .62, metalness: 0 });
    const g = new THREE.Group();
    g.add(lathe(smooth([[0, 0], [.55, .02], [.9, .35], [1.05, 1.0], [.95, 1.7], [.55, 2.15], [.42, 2.35], [.5, 2.5], [.46, 2.52], [.36, 2.4], [0.001, 2.38]]), mat));
    return { g, cam: [0, 1.35, 6.4], look: [0, 1.15, 0], fov: 30 };
  }},
  bowl: { w: 1200, h: 1200, bg: "#e2d6c3", build() {
    const tex = noiseCanvas(1024, 1024, "#5d6b5a", [["#a7a58a", 700, 16, .35], ["#2f3a31", 400, 8, .5]], 3, 1);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .35, side: THREE.DoubleSide });
    const g = new THREE.Group();
    g.add(lathe(smooth([[0, 0], [.4, 0], [.5, .08], [.95, .55], [1.12, 1.0], [1.08, 1.02], [.9, .6], [.45, .2], [0.001, .16]]), mat));
    return { g, cam: [0, 2.3, 4.6], look: [0, .45, 0], fov: 32 };
  }},
  salt: { w: 1500, h: 1000, bg: "#e6dccd", build() {
    const tex = noiseCanvas(1024, 1024, "#e8e1d2", [["#b8a98e", 600, 6, .4], ["#7c6a55", 120, 4, .5]], 11);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .8, side: THREE.DoubleSide });
    const g = new THREE.Group();
    for (const [x, s] of [[-1.25, .8], [.2, 1], [1.45, .62]]) {
      const b = lathe(smooth([[0, 0], [.5, 0], [.62, .05], [1.05, .32], [1.18, .52], [1.12, .53], [.95, .34], [.5, .1], [0.001, .08]]), mat);
      b.scale.setScalar(s); b.position.x = x; g.add(b);
    }
    return { g, cam: [0, 2.6, 6.2], look: [0, .2, 0], fov: 30 };
  }},
  lota: { w: 1100, h: 1375, bg: "#d6c9b5", build() {
    const mat = new THREE.MeshStandardMaterial({ color: "#b8893e", roughness: .28, metalness: .95 });
    const g = new THREE.Group();
    g.add(lathe(smooth([[0, 0], [.42, .0], [.48, .08], [.38, .16], [.82, .55], [1.0, 1.0], [.86, 1.42], [.42, 1.72], [.36, 1.95], [.52, 2.12], [.5, 2.16], [.33, 2.02], [0.001, 2.0]]), mat));
    return { g, cam: [0, 1.25, 6.0], look: [0, 1.0, 0], fov: 30, env: true };
  }},
  textile: { w: 1500, h: 1000, bg: "#e4d9c8", build() {
    const c = document.createElement("canvas"); c.width = 1024; c.height = 1024; const x = c.getContext("2d");
    x.fillStyle = "#24365e"; x.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 1024; i += 6) { x.fillStyle = i % 12 ? "rgba(255,255,255,.05)" : "rgba(0,0,0,.12)"; x.fillRect(0, i, 1024, 3); x.fillRect(i, 0, 2, 1024); }
    x.strokeStyle = "rgba(232,224,206,.85)"; x.lineWidth = 7;
    for (let k = 0; k < 6; k++) { x.beginPath(); for (let t = 0; t < 1024; t += 8) x.lineTo(t, 160 + k * 150 + Math.sin(t / 60 + k) * 18); x.stroke(); }
    x.fillStyle = "rgba(232,224,206,.8)";
    for (let k = 0; k < 6; k++) for (let t = 30; t < 1024; t += 64) { x.beginPath(); x.arc(t, 235 + k * 150, 9, 0, 7); x.fill(); }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const geo = new THREE.PlaneGeometry(5.2, 3.4, 200, 140);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) { const X = p.getX(i), Y = p.getY(i);
      p.setZ(i, .12 * Math.sin(X * 2.1 + Y * .4) + .06 * Math.sin(Y * 5 + X) + (X > 1.4 ? (X - 1.4) * (X - 1.4) * .5 * Math.abs(Math.sin(Y * 3)) : 0)); }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: .95, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.position.y = .32; m.castShadow = m.receiveShadow = true;
    const g = new THREE.Group(); g.add(m);
    return { g, cam: [0, 5.6, 4.2], look: [0, 0, -.1], fov: 38 };
  }},
  wood: { w: 1500, h: 1000, bg: "#e0d4c0", build() {
    const c = document.createElement("canvas"); c.width = 1024; c.height = 1024; const x = c.getContext("2d");
    x.fillStyle = "#7a5233"; x.fillRect(0, 0, 1024, 1024);
    for (let i = 0; i < 160; i++) { x.strokeStyle = `rgba(${i % 3 ? 50 : 160},${i % 3 ? 30 : 110},${i % 3 ? 15 : 70},.25)`; x.lineWidth = 1 + (i % 4);
      x.beginPath(); for (let t = 0; t < 1024; t += 16) x.lineTo(t, i * 6.4 + Math.sin(t / 90 + i * .3) * 14); x.stroke(); }
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .55, side: THREE.DoubleSide });
    const g = new THREE.Group();
    const b = lathe(smooth([[0, 0], [.7, 0], [.85, .06], [1.55, .5], [1.75, .78], [1.68, .8], [1.4, .55], [.7, .18], [0.001, .15]]), mat);
    g.add(b);
    return { g, cam: [0, 2.4, 5.6], look: [0, .3, 0], fov: 34 };
  }},
  paper: { w: 1200, h: 1200, bg: "#ddd2c0", build() {
    const mat = new THREE.MeshStandardMaterial({ color: "#f1ebdf", roughness: .95 });
    const g = new THREE.Group();
    for (let i = 0; i < 9; i++) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(1.9 - i * .06, .04, 1.4 - i * .05), mat);
      m.position.y = .03 + i * .05; m.rotation.y = (i - 4) * .09; m.castShadow = m.receiveShadow = true; g.add(m);
    }
    const fold = new THREE.Mesh(new THREE.ConeGeometry(.45, 1.1, 4, 1, true), new THREE.MeshStandardMaterial({ color: "#e7dccb", roughness: .9, side: THREE.DoubleSide, flatShading: true }));
    fold.position.set(.15, .98, 0); fold.rotation.y = .5; fold.castShadow = true; g.add(fold);
    return { g, cam: [0, 2.7, 4.4], look: [0, .45, 0], fov: 34 };
  }},
  bottle: { w: 1000, h: 1400, bg: "#d3c6b2", build() {
    const tex = noiseCanvas(1024, 1024, "#3e3a36", [["#8f7b5f", 500, 12, .35], ["#1f1c19", 300, 18, .5], ["#b3a58a", 160, 6, .5]], 5, 1);
    const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: .4 });
    const g = new THREE.Group();
    g.add(lathe(smooth([[0, 0], [.5, 0], [.62, .1], [.7, .7], [.62, 1.3], [.26, 1.85], [.2, 2.6], [.26, 2.85], [.2, 2.88], [0.001, 2.86]]), mat));
    return { g, cam: [0, 1.5, 6.6], look: [0, 1.4, 0], fov: 30 };
  }},
};

window.render = (name) => {
  const def = scenes[name];
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(def.w, def.h); renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.innerHTML = ""; document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(def.bg);
  const { g, cam, look, fov, env } = def.build(); scene.add(g);
  // A paper sweep: floor curving into the wall.
  const sweep = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: def.bg, roughness: 1 }));
  sweep.rotation.x = -Math.PI / 2; sweep.receiveShadow = true; scene.add(sweep);
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 20), new THREE.MeshStandardMaterial({ color: def.bg, roughness: 1 }));
  wall.position.set(0, 10, -6); scene.add(wall);
  scene.add(new THREE.HemisphereLight("#fff6e8", "#8a7a66", .9));
  const key = new THREE.DirectionalLight("#fff1dc", 2.6); key.position.set(-4, 7, 4); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; key.shadow.bias = -.0004;
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 }); scene.add(key);
  const rim = new THREE.DirectionalLight("#ffe2c0", .9); rim.position.set(5, 4, -3); scene.add(rim);
  if (env) { const pm = new THREE.PMREMGenerator(renderer); const e = new THREE.Scene();
    e.background = new THREE.Color("#f3e6d2"); const l = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshBasicMaterial({ color: "#fff8ee", side: THREE.BackSide })); e.add(l);
    const d = new THREE.Mesh(new THREE.PlaneGeometry(.6, 2), new THREE.MeshBasicMaterial({ color: "#3a2e22", side: THREE.DoubleSide })); d.position.set(.9, 0, 0); d.rotation.y = Math.PI / 2; e.add(d);
    scene.environment = pm.fromScene(e, .02).texture; }
  const camera = new THREE.PerspectiveCamera(fov, def.w / def.h, .1, 100);
  camera.position.set(...cam); camera.lookAt(...look);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL("image/jpeg", 0.9);
};
window.ready = true;
</script></body></html>
